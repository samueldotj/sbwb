name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  VCPKG_DEFAULT_TRIPLET: x64-windows-static-md

jobs:
  # License, source and advisory policy (deny.toml). Runs without the native
  # toolchain, so a policy failure shows up in a minute rather than after the build.
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Licenses, bans, sources
        run: cargo deny check licenses bans sources
      # A new advisory against an unchanged lockfile should be visible without
      # blocking unrelated work; releases are cut from a run where this is green.
      - name: Advisories
        continue-on-error: true
        run: cargo deny check advisories

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-about

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vcpkg-cache
          key: vcpkg-x64-windows-static-md-tesseract-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: vcpkg-x64-windows-static-md-tesseract-

      - name: Build Tesseract and Leptonica with vcpkg
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP "vcpkg-cache"
          New-Item -ItemType Directory -Force $cache | Out-Null
          $env:VCPKG_BINARY_SOURCES = "clear;files,$cache,readwrite"
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install tesseract:x64-windows-static-md leptonica:x64-windows-static-md
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Fetch PDFium and recognition models
        shell: pwsh
        run: ./scripts/fetch-deps.ps1

      - uses: Swatinem/rust-cache@v2

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

      # The worker-process tests skip unless they are given an executable that
      # serves `--worker`; the bench binary does.
      - name: Build the test worker
        shell: pwsh
        run: |
          cargo build -p sbwb-bench
          echo "SBWB_TEST_WORKER_EXE=$env:GITHUB_WORKSPACE\target\debug\sbwb-bench.exe" >> $env:GITHUB_ENV

      - name: Test
        run: cargo nextest run --workspace --profile ci
      - name: Doc tests
        run: cargo test --workspace --doc

      - name: License texts
        run: cargo about generate about.hbs -o THIRD-PARTY-LICENSES.html

      - name: Bundle installer
        run: npm run tauri build -- --ci

      - name: Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem target/release/bundle/nsis/*.exe, target/release/bundle/msi/*.msi
          $files | ForEach-Object { "$((Get-FileHash -Algorithm SHA256 $_).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: sbwb-windows-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            SHA256SUMS.txt
            THIRD-PARTY-LICENSES.html
            THIRD-PARTY-NOTICES.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
