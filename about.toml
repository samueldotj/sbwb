# cargo-about: full license texts for the crates that ship in the installer
# (NFR-12). Keep `accepted` in step with `[licenses].allow` in deny.toml.
# Usage: cargo about generate about.hbs -o THIRD-PARTY-LICENSES.html

targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
  "0BSD",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "OpenSSL",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
