[graph]
targets = [{ triple = "x86_64-pc-windows-msvc" }]

[advisories]
# Unmaintained-crate notices with no fix available to this workspace. Each
# entry says where the crate comes from; remove it when the parent moves on.
ignore = [
  # unic-* come from urlpattern, which tauri-utils uses to parse capability
  # URL patterns at build and start-up. No untrusted input reaches it.
  { id = "RUSTSEC-2025-0075", reason = "unic-char-range via tauri-utils/urlpattern" },
  { id = "RUSTSEC-2025-0080", reason = "unic-common via tauri-utils/urlpattern" },
  { id = "RUSTSEC-2025-0081", reason = "unic-char-property via tauri-utils/urlpattern" },
  { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version via tauri-utils/urlpattern" },
  { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident via tauri-utils/urlpattern" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
  "0BSD",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "OpenSSL",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
