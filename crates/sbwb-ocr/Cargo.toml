[package]
name = "sbwb-ocr"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tesseract adapter producing words with boxes and native confidences"

[dependencies]
sbwb-core.workspace = true
tesseract.workspace = true
tesseract-sys = "0.6"
sha2.workspace = true
image.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
ocrs = { version = "0.13", optional = true }
rten = { version = "0.26", optional = true }
rten-imageproc = { version = "0.26", optional = true }

[features]
default = ["ocrs"]
ocrs = ["dep:ocrs", "dep:rten", "dep:rten-imageproc"]

[dev-dependencies]
sbwb-pdf.workspace = true
tempfile.workspace = true
