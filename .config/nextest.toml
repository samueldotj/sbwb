# cargo-nextest configuration. Local: `cargo nextest run --workspace`.

[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

# Tests that start worker processes and run real OCR are heavy; keep them from
# piling up on small machines.
[[profile.default.overrides]]
filter = "package(sbwb-pipeline) | package(sbwb-worker) | package(sbwb-bench)"
threads-required = 2

[profile.ci]
fail-fast = false
retries = 0
slow-timeout = { period = "120s", terminate-after = 5 }

[profile.ci.junit]
path = "junit.xml"
